<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Demo | Proof of Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505; --bg-card: #0a0a0a; --bg-glass: rgba(10, 10, 10, 0.8);
            --border: #1f1f1f; --text-main: #f5f5f5; --text-muted: #888; --accent: #00ff88;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; line-height: 1.6; }
        
        nav {
            position: fixed; top: 0; width: 100%; background: var(--bg-glass); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 5%;
        }
        .logo { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-main); }
        .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }

        .content { max-width: 600px; margin: 0 auto; padding: 10rem 5% 5rem; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
        .subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
        
        .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
        .form-control {
            width: 100%; padding: 0.8rem 1rem; background: var(--bg-dark); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-main); font-family: inherit; transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: var(--accent); }
        textarea.form-control { resize: vertical; min-height: 120px; }
        
        .btn-submit { width: 100%; padding: 0.9rem; background: var(--text-main); color: var(--bg-dark); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #d1d1d1; }

        footer { text-align: center; padding: 3rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo"><div class="logo-dot"></div> Proof of Intelligence</a>
        <div class="nav-links">
            <a href="index.html">Overview</a>
            <a href="technology.html">Technology</a>
            <a href="traction.html">Traction & Model</a>
            <a href="contact.html" class="active" style="color: var(--text-main);">Request Demo</a>
        </div>
    </nav>

    <div class="content">
        <h1>Request Investor Demo</h1>
        <p class="subtitle">Connect directly with the founder to review the live architecture or pitch deck.</p>

        <div class="form-card">
            <!-- Replace YOUR_FORMSPREE_ID with your formspree endpoint -->
            <form action="https://formspree.io/f/mljdgywk" method="POST">
                <div class="form-group">
                    <label>Name & Venture / Fund</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Alex, Sequoia Capital">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="alex@fund.com">
                </div>
                <div class="form-group">
                    <label>Message or Focus Area</label>
                    <textarea name="message" class="form-control" required placeholder="Interested in reviewing the technical architecture and pre-seed terms..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit Request</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Proof of Intelligence. Built for high-velocity technical execution.</p>
    </footer>
</body>
</html>
